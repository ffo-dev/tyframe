[tool.poe.tasks.test]
cmd = "pytest --cov=src/tyframe src/tests/ --cov-report=term-missing"

[tool.poe.tasks.format]
args = [
    { name = "path", default = ".", positional = true, help = "File or directory to format" }
]
sequence = [
    { cmd = "uv run ruff format --config ruff.toml ${path}" },
    { cmd = "uv run ruff check --fix --config ruff.toml ${path}" }
]

[tool.poe.tasks.format-unsafe]
cmd = "uv run ruff check --unsafe-fixes --fix --config ruff.toml"

[tool.poe.tasks.check-format]
cmd = "uv run ruff check --config ruff.toml"

[tool.poe.tasks.check-pyright]
cmd = "uv run basedpyright ."

[tool.poe.tasks.check-all]
sequence = [
    "check-format",
    "check-pyright"
]

[tool.poe.tasks.generate-test-wrappers]
sequence = [
    { cmd = "tyframe generate-typed-wrapper src/tests/test_classes src/tests/generated_models/pandas tyframe_config.yml pandas Pd"},
    { cmd = "tyframe generate-typed-wrapper src/tests/test_classes src/tests/generated_models/polars tyframe_config.yml polars Pl" },
    { cmd = "tyframe generate-typed-wrapper src/tests/test_classes src/tests/generated_models/lazy_polars tyframe_config.yml lazy_polars Lpl" },
    { cmd = "poe format"},
]


[tool.poe.tasks.generate-example-wrappers]
sequence = [
    { cmd = "tyframe generate-typed-wrapper src/examples/source src/examples/generated tyframe_config.yml polars Pl" },
    { cmd = "poe format"},
]

