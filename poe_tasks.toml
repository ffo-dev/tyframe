[tool.poe.tasks.test]
cmd = "pytest --cov=src/tyframe src/tests/ --cov-report=term-missing"

[tool.poe.tasks.format]
args = [
    { name = "path", default = ".", positional = true, help = "File or directory to format" }
]
sequence = [
    { cmd = "uv run ruff format --config ruff.toml ${path}" },
    { cmd = "uv run ruff check --fix --config ruff.toml ${path}" }
]

[tool.poe.tasks.format-unsafe]
cmd = "uv run ruff check --unsafe-fixes --fix --config ruff.toml"

[tool.poe.tasks.check-format]
cmd = "uv run ruff check --config ruff.toml"

[tool.poe.tasks.check-pyright]
cmd = "uv run basedpyright ."

[tool.poe.tasks.check-all]
sequence = [
    "check-format",
    "check-pyright"
]

[tool.poe.tasks.generate-test-wrappers]
sequence = [
    { cmd = "tyframe generate-typed-wrapper --input-path src/tests/test_classes --output-path src/tests/generated_models/pandas --df-type pandas --class-suffix Pd"},
    { cmd = "tyframe generate-typed-wrapper --input-path src/tests/test_classes --output-path src/tests/generated_models/polars --df-type polars --class-suffix Pl" },
    { cmd = "tyframe generate-typed-wrapper --input-path src/tests/test_classes --output-path src/tests/generated_models/lazy_polars --df-type lazy_polars --class-suffix Lpl" },
    { cmd = "poe format"},
]


[tool.poe.tasks.generate-example-wrappers]
sequence = [
    { cmd = "tyframe generate-typed-wrapper --input-path src/examples/source --output-path src/examples/generated --df-type polars --class-suffix Pl" },
    { cmd = "poe format"},
]

[tool.poe.tasks.generate-benchmark-wrappers]
sequence = [
    { cmd = "tyframe generate-typed-wrapper --input-path src/benchmark/source_classes --output-path src/benchmark/generated/polars --df-type polars --class-suffix Pl" },
    { cmd = "tyframe generate-typed-wrapper --input-path src/benchmark/source_classes --output-path src/benchmark/generated/pandas --df-type pandas --class-suffix Pd" },
    { cmd = "poe format" },
]

[tool.poe.tasks.benchmark]
cmd = "uv run python -m benchmark --repeat $repeat"
args = [
    { name = "repeat", default = 1000, help = "Num repeats" }
]
