[project]
name = "tyframe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.6,<3",
    "polars>=1, <2",
    "pydantic>=2,<3",
    "typer>=0.6.0",
]

[project.scripts]
tyframe = "tyframe:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "poethepoet>=0.48.0",
    "ruff>=0.16.9",
    "pandas-stubs>=2.0.6,<3",
    "pytest>=7.0.0",
    "pytest-cov"
]
