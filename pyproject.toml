[project]
name = "tyframe"
version = "0.0.1"
description = "Generate typed pandas/polars DataFrame wrappers from pydantic models"  # your own words
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ffo-dev" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pandas>=2.0.6,<4",
    "polars>=1,<3",
    "pydantic>=2,<3",
    "typer>=0.3.0",
]

[project.urls]
Repository = "https://github.com/ffo-dev/tyframe"

[project.scripts]
tyframe = "tyframe:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "poethepoet>=0.48.0",
    "ruff>=0.16.9",
    "pandas-stubs>=2.0.6,<3",
    "pytest>=7.0.0",
    "pytest-cov"
]