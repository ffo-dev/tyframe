line-length = 120

[lint.flake8-quotes]
inline-quotes = "single"

[format]
quote-style = "single"

[lint]
select = ["ALL"]  # See the Default Rules page for the full listing.
ignore = [
    "CPY",
    "D"
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

[lint.flake8-annotations]
allow-star-arg-any = true

[lint.extend-per-file-ignores]
"/*/tests/**.py" = [
    "S101",
    "PLR2004"
]