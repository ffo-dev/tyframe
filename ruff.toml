line-length = 120

exclude = [
    "src/tests/test_code_gen/test_pydantic_model_generator/expected/*",
    "src/tests/test_code_gen/test_based_typed_df_generator/expected_output/*"
]
# Also skip excluded files when passed explicitly on the command line.
force-exclude = true

[lint.flake8-quotes]
inline-quotes = "single"

[format]
quote-style = "single"
indent-style = "space"

[lint]
select = ["ALL"]  # See the Default Rules page for the full listing.
ignore = [
    "CPY",
    "D",
    "COM812"
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

[lint.flake8-annotations]
allow-star-arg-any = true

[lint.extend-per-file-ignores]
"/*/tests/**.py" = [
    "S101",
    "PLR2004"
]