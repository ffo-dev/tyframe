# CI: lint/type-check on the pinned Python version, tests across a compatibility matrix.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "feature/*" ]

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff format + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        run: uv python install

      - name: Sync environment
        run: uv sync --all-groups

      - name: install poe
        run: uv tool install poethepoet

      - name: check poe
        run: poe --version

      - name: check format
        run: poe check-format

      - name: check pyright
        run: poe check-pyright

  test:
    name: 'test python ${{ matrix.python-version }} / ${{ matrix.polars.name }} / ${{ matrix.pandas.name }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        polars:
          - { name: 'polars 1.x', constraint: '>=1,<2' }
          - { name: 'polars 2.x', constraint: '>=2,<3' }
        pandas:
          - { name: 'pandas 2.x', constraint: '>=2,<3' }
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync base environment
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Pin polars/pandas to the matrix versions
        run: uv pip install --python .venv/bin/python "polars${{ matrix.polars.constraint }}" "pandas${{ matrix.pandas.constraint }}"

      - name: check test
        run: uv run --no-sync poe test
